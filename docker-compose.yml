services:
  postgres:
    image: postgres:16-alpine
    container_name: praca-postgres
    environment:
      POSTGRES_USER: praca
      POSTGRES_PASSWORD: praca
      POSTGRES_DB: praca
    ports:
      - '5437:5432'
    volumes:
      - praca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U praca -d praca']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: praca-api
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://praca:praca@postgres:5432/praca?schema=public
      # Sem segredo embutido: `validateEnv` exige 16+ chars, então o container
      # falha na largada com mensagem clara em vez de subir com segredo público.
      JWT_SECRET: ${JWT_SECRET:-}
      NODE_ENV: production
      PORT: 3014
      CORS_ORIGINS: http://localhost:3024
      PUBLIC_URL: http://localhost:3014
      APP_URL: http://localhost:3024
      # Flags declaradas mesmo quando o default do zod já resolve: regra de ops
      # do workspace (flag nova precisa aparecer no compose, senão ninguém sabe
      # que ela existe ao subir em produção). Ver README, "Produção".
      #
      # `TRUST_PROXY` fica `false` aqui porque o compose publica a porta direto;
      # atrás de nginx, `true` — sem isso o teto por IP vale para o mundo todo.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUBLIC_LEADS_PER_MINUTE: ${PUBLIC_LEADS_PER_MINUTE:-10}
      CADENCE_ENGINE_ENABLED: ${CADENCE_ENGINE_ENABLED:-true}
      FREELA_SYNC_ENABLED: ${FREELA_SYNC_ENABLED:-true}
    ports:
      - '3014:3014'

# Sub-rede fixa: o pool padrão do Docker (172.17-31) já está esgotado nesta
# máquina e a rede caía em 192.168.0.0/20, colidindo com a Wi-Fi do dono
# (192.168.0.x) — o host deixava de alcançar localhost:5437.
networks:
  default:
    ipam:
      config:
        - subnet: 172.60.0.0/24

volumes:
  praca_pgdata:
