services:
  postgres:
    image: postgres:16-alpine
    container_name: praca-postgres
    environment:
      POSTGRES_USER: praca
      POSTGRES_PASSWORD: praca
      POSTGRES_DB: praca
    ports:
      - '5437:5432'
    volumes:
      - praca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U praca -d praca']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: praca-api
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://praca:praca@postgres:5432/praca?schema=public
      # Sem segredo embutido: `validateEnv` exige 16+ chars, então o container
      # falha na largada com mensagem clara em vez de subir com segredo público.
      JWT_SECRET: ${JWT_SECRET:-}
      NODE_ENV: production
      PORT: 3014
      CORS_ORIGINS: http://localhost:3024
      PUBLIC_URL: http://localhost:3014
      APP_URL: http://localhost:3024
      # Flags declaradas mesmo quando o default do zod já resolve: regra de ops
      # do workspace (flag nova precisa aparecer no compose, senão ninguém sabe
      # que ela existe ao subir em produção). Ver README, "Produção".
      #
      # `TRUST_PROXY` fica `false` aqui porque o compose publica a porta direto;
      # atrás de nginx, `true` — sem isso o teto por IP vale para o mundo todo.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUBLIC_LEADS_PER_MINUTE: ${PUBLIC_LEADS_PER_MINUTE:-10}
      CADENCE_ENGINE_ENABLED: ${CADENCE_ENGINE_ENABLED:-true}
      FREELA_SYNC_ENABLED: ${FREELA_SYNC_ENABLED:-true}
      # Consultores de campo (README, "Consultores de campo"). `PHOTO_STORAGE`
      # vazio = padrão da API (s3 em produção, disk fora); vazio é tratado como
      # ausente. Sem S3_BUCKET/S3_REGION todo check-in responde 503 (a feature não funciona).
      FREELA_WEB_URL: ${FREELA_WEB_URL:-}
      CAMPO_JWT_EXPIRES_IN: ${CAMPO_JWT_EXPIRES_IN:-7d}
      PHOTO_STORAGE: ${PHOTO_STORAGE:-}
      PHOTOS_DIR: ${PHOTOS_DIR:-./uploads}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Pesquisa automática de estabelecimentos (contrato §22). Overpass não usa chave.
      # Apify só funciona com APIFY_ENABLED=true E APIFY_TOKEN (segredo do dono, no servidor).
      OVERPASS_URL: ${OVERPASS_URL:-}
      PLACES_USER_AGENT: ${PLACES_USER_AGENT:-}
      APIFY_ENABLED: ${APIFY_ENABLED:-false}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-}
      APIFY_MAX_PLACES_PER_RUN: ${APIFY_MAX_PLACES_PER_RUN:-300}
      APIFY_MONTHLY_PLACES_CAP: ${APIFY_MONTHLY_PLACES_CAP:-3000}
      # Roteiro do dia do consultor (contrato §23). Os parâmetros (meta, horários) ficam em app_settings.field_config.
      FIELD_ROUTES_ENABLED: ${FIELD_ROUTES_ENABLED:-false}
      # Cadastro assistido no Freela (contrato §26). Só ligar com o api-freela e a página /primeiro-acesso no ar.
      FIELD_COMPANY_SIGNUP_ENABLED: ${FIELD_COMPANY_SIGNUP_ENABLED:-false}
      # Sync dos cadastros confirmados pelo Freela (contrato §27). A regra de "confirmado" fica em app_settings.field_config.
      FIELD_SIGNUP_SYNC_ENABLED: ${FIELD_SIGNUP_SYNC_ENABLED:-false}
      FIELD_SIGNUP_SYNC_INTERVAL_MIN: ${FIELD_SIGNUP_SYNC_INTERVAL_MIN:-10}
      FIELD_SIGNUP_RECONCILE_DAYS: ${FIELD_SIGNUP_RECONCILE_DAYS:-45}
      # Remuneração do consultor (contrato §28). Valores e faixas ficam no banco (tela de Configurações), nunca aqui.
      FIELD_EARNINGS_ENABLED: ${FIELD_EARNINGS_ENABLED:-false}
      FIELD_EARNINGS_AUTOCLOSE_ENABLED: ${FIELD_EARNINGS_AUTOCLOSE_ENABLED:-false}
      # Pagamento por Pix manual (contrato §29): exige FIELD_EARNINGS_ENABLED. Só registra; não move dinheiro.
      FIELD_PAYOUTS_ENABLED: ${FIELD_PAYOUTS_ENABLED:-false}
      FIELD_VISIT_FLOW_SELECT_ENABLED: ${FIELD_VISIT_FLOW_SELECT_ENABLED:-false}
      # Modo do chefe S3 (contrato §32.5): ganho por cadastro declarado. Exige FIELD_EARNINGS_ENABLED.
      FIELD_DECLARED_SIGNUPS_ENABLED: ${FIELD_DECLARED_SIGNUPS_ENABLED:-false}
      # Restante da Lovable, lote A (contrato §33/§34): painel do gestor, resumo/nota do dia e mapa de pinos. Só leitura.
      FIELD_DASHBOARD_ENABLED: ${FIELD_DASHBOARD_ENABLED:-false}
      FIELD_DAY_SUMMARY_ENABLED: ${FIELD_DAY_SUMMARY_ENABLED:-false}
      FIELD_MAP_PINS_ENABLED: ${FIELD_MAP_PINS_ENABLED:-false}
      FIELD_CHECKLIST_ENABLED: ${FIELD_CHECKLIST_ENABLED:-false}
      FIELD_BREAKS_ENABLED: ${FIELD_BREAKS_ENABLED:-false}
      # Restante da Lovable, lote C (contrato §36/§38): segmentos da busca, pedidos de cupom e o cupom real no Freela (este exige FIELD_VOUCHERS_ENABLED).
      FIELD_SEGMENTS_ENABLED: ${FIELD_SEGMENTS_ENABLED:-false}
      FIELD_VOUCHERS_ENABLED: ${FIELD_VOUCHERS_ENABLED:-false}
      FIELD_VOUCHER_COUPONS_ENABLED: ${FIELD_VOUCHER_COUPONS_ENABLED:-false}
      # Restante da Lovable, lote D (contrato §39/§40): planos de rota (exige FIELD_ROUTES_ENABLED) e shoppings (exige SEGMENTS e ROUTE_PLANS).
      FIELD_ROUTE_PLANS_ENABLED: ${FIELD_ROUTE_PLANS_ENABLED:-false}
      FIELD_MALLS_ENABLED: ${FIELD_MALLS_ENABLED:-false}
      # Restante da Lovable, lote E (contrato §41/§42): regra de senha nova, cadastro do consultor, e-mail do contato e perfil gestor.
      PASSWORD_POLICY_ENABLED: ${PASSWORD_POLICY_ENABLED:-false}
      FIELD_CONSULTANT_PROFILE_ENABLED: ${FIELD_CONSULTANT_PROFILE_ENABLED:-false}
      FIELD_CONTACT_EMAIL_ENABLED: ${FIELD_CONTACT_EMAIL_ENABLED:-false}
      TEAM_GESTOR_ENABLED: ${TEAM_GESTOR_ENABLED:-false}
      # Restante da Lovable, lote F1 (contrato §43/§45): bônus mensal e regra de pagamento por consultor (exigem FIELD_EARNINGS_ENABLED).
      FIELD_EARNINGS_MONTHLY_ENABLED: ${FIELD_EARNINGS_MONTHLY_ENABLED:-false}
      FIELD_EARNINGS_PER_CONSULTANT_ENABLED: ${FIELD_EARNINGS_PER_CONSULTANT_ENABLED:-false}
    ports:
      - '3014:3014'

# Sub-rede fixa: o pool padrão do Docker (172.17-31) já está esgotado nesta
# máquina e a rede caía em 192.168.0.0/20, colidindo com a Wi-Fi do dono
# (192.168.0.x) — o host deixava de alcançar localhost:5437.
networks:
  default:
    ipam:
      config:
        - subnet: 172.60.0.0/24

volumes:
  praca_pgdata:
