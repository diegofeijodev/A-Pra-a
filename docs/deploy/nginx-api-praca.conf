# /etc/nginx/sites-available/praca-api  (symlink em sites-enabled). Só HTTP: o certbot
# acrescenta o bloco SSL: sudo certbot --nginx -d api-praca.freelaservicosapp.com.br
server {
    listen 80;
    listen [::]:80;
    server_name api-praca.freelaservicosapp.com.br;

    # corpo da API: até 8 MB (bodyLimit do Fastify); foto da fachada até 5 MB (multipart)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # SOBRESCREVE (não acrescenta): com TRUST_PROXY a API lê este valor como o IP do cliente;
        # acrescentar deixaria o cliente forjar o IP e burlar o limite por IP (login, formulário público).
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
